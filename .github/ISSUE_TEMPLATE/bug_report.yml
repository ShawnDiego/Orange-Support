name: 问题或内容反馈
description: 提交问题报告、内容或元数据错误、体验问题及其他反馈
title: "[反馈] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交密码、Cookie、访问令牌、刷新令牌、验证码、手机号、邮箱、媒体文件名、完整私人路径或其他用户数据。
  - type: dropdown
    id: feedback_type
    attributes:
      label: 反馈类型
      options:
        - 问题报告
        - 内容或元数据错误
        - 体验建议
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orange 版本
      description: 可在应用设置或官网版本说明中确认。
      placeholder: 例如 1.0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 问题模块
      options:
        - 安装与启动
        - 媒体源
        - 扫描与刮削
        - 媒体库
        - 播放
        - 字幕与音轨
        - 账号与云同步
        - 性能或崩溃
        - 其他
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 影响程度
      options:
        - 建议
        - 轻微
        - 明显影响
        - 完全阻塞
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: 一句话概述
      placeholder: 用一句话说明发生了什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从启动应用开始的最短步骤。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 补充信息
      description: 只提供定位问题所需的最少信息；截图和诊断片段必须先移除私人路径、文件名、账号和凭据。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查正文和附件，不包含密码、令牌、私人路径、媒体文件名或其他用户数据。
          required: true
